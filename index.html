<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ClipCut – Web Video Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="css/style.css"></head><body>
<header><h1><b>Clip</b>Cut <span class="mu">· web video editor</span></h1>
<div><button onclick="$('f').click()">+ Import video</button> <button class="p" id="ex" onclick="exportV()">Export</button></div></header>
<input id="f" type="file" accept="video/*" multiple hidden>
<main>
<section class="pn">
<canvas id="cv" width="1280" height="720"></canvas>
<div class="bar"><button id="pl" onclick="toggle()">▶ Play</button><button onclick="split()">✂ Split</button><button onclick="del()">🗑 Delete</button><button onclick="mv(-1)">◀</button><button onclick="mv(1)">▶</button><span class="mu" id="tm">0:00 / 0:00</span></div>
<div id="tl"><div id="in"></div></div>
<p class="mu" id="hint">Import one or more videos to start. Click the timeline to scrub.</p>
</section>
<aside class="pn">
<b>Clip</b>
<label>Trim start <span id="a1"></span></label><input type="range" id="ts" min="0" max="1" step="0.01">
<label>Trim end <span id="a2"></span></label><input type="range" id="te" min="0" max="1" step="0.01">
<label>Speed</label><select id="sp"><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option></select>
<label>Filter</label><select id="fl"><option value="none">None</option><option value="grayscale(1)">B&amp;W</option><option value="sepia(.8)">Vintage</option><option value="saturate(1.8) contrast(1.1)">Vivid</option><option value="blur(2px)">Blur</option><option value="brightness(1.3)">Bright</option></select>
<hr style="border:0;border-top:1px solid var(--bd);margin:14px 0">
<b>Text</b>
<label>Caption</label><input type="text" id="tt" placeholder="Your text">
<label>Length (s)</label><input type="number" id="td" value="3" min="0.5" step="0.5">
<div class="bar"><button onclick="addT()">Add at playhead</button></div>
<div id="tx"></div>
</aside></main>
<dialog id="dg"><b>Export ready</b><p class="mu">Right-click / long-press the video to save it (WebM).</p><video id="rv" controls></video><div class="bar"><button onclick="$('dg').close()">Close</button></div></dialog>
<script src="js/app.js"></script></body></html>
